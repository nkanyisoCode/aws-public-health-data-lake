name: terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambda/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: terraform/envs/dev

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS credentials (plan role)
        if: vars.AWS_PLAN_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: af-south-1

      - run: terraform fmt -check -recursive
        working-directory: terraform

      - run: terraform init -backend=false

      - run: terraform validate

      - run: terraform plan -no-color -input=false -var-file=dev.tfvars
        if: vars.AWS_PLAN_ROLE_ARN != ''

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: af-south-1

      - run: terraform init

      - run: terraform apply -auto-approve -input=false -var-file=dev.tfvars
